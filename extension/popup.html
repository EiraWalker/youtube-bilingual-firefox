<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>YouTube 双语字幕</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body class="popup">
  <main>
    <header class="popup-header">
      <span class="brand-mark" aria-hidden="true">文<span>A</span></span>
      <div><p class="eyebrow">FIREFOX · LOCAL</p><h1>YouTube <span>双语字幕</span></h1></div>
    </header>
    <section class="quick-guide" aria-label="使用指南">
      <ol>
        <li><span class="step-number" aria-hidden="true">01</span><div><h2>在视频里开启</h2><p>打开 YouTube，单击播放器中的<br>「双语字幕」。</p></div></li>
        <li><span class="step-number" aria-hidden="true">02</span><div><h2>更多字幕操作</h2><p>右键按钮，选择语言、重新翻译<br>或导出 SRT。</p></div></li>
      </ol>
    </section>
    <div class="popup-actions"><button id="open-settings" type="button">API 与已保存字幕<span aria-hidden="true">→</span></button><p id="status" role="status" aria-live="polite"></p></div>
    <footer>整轨翻译<span aria-hidden="true"> · </span>后台保存<span aria-hidden="true"> · </span>SRT 导出</footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
